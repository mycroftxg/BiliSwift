name: Release BiliSwift
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-26
    env:
      BILI_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - name: Check version
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Scripts/Info.plist)"
          test "$BILI_TAG" = "v$version"
          echo "BILI_VERSION=$version" >> "$GITHUB_ENV"
      - run: swift test
      - run: zsh Scripts/package-dmg.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk 'NR > 1 && /^# / { exit } NR > 1 { print }' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          gh release create "$BILI_TAG" "../BiliSwift-$BILI_VERSION.dmg" --verify-tag --title "BiliSwift $BILI_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
